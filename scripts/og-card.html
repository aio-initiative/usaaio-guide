<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Source for public/assets/og-card.png — the 1200x630 image Discord, Slack,
      iMessage and Twitter show when someone pastes a link to the site.

      This mirrors the homepage splash (.splash-content in src/styles/main.css):
      same Outfit display face, same --brand terracotta, same node-graph logo,
      same particle constellation. Type is scaled up from the live hero because
      chat clients render the card at roughly a third of its true width, where
      the site's 19px body copy would be illegible.

      Render it with:  python3 scripts/make-og-image.py
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap"
    />
    <style>
      /* Tokens copied from :root in src/styles/main.css. */
      :root {
        --brand: #b84e30;
        --brand-soft: #d4805c;
        --paper: #ffffff;
        --ink: #111111;
        --muted: #5c5c5c;
        --shadow-md: 0 1px 2px rgba(24, 24, 27, 0.04),
          0 12px 28px -12px rgba(24, 24, 27, 0.14);
        --shadow-brand: 0 10px 24px -10px rgba(184, 78, 48, 0.5);
        --font-display: "Outfit", ui-sans-serif, system-ui, -apple-system,
          "Segoe UI", sans-serif;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--paper);
        font-family: var(--font-display);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Same constellation the hero canvas paints, seeded so the card is
         reproducible instead of different on every render. */
      #net {
        position: absolute;
        inset: 0;
        width: 1200px;
        height: 630px;
      }

      .content {
        position: relative;
        display: grid;
        justify-items: center;
        text-align: center;
        gap: 26px;
        padding-bottom: 34px;
      }

      .logo {
        width: 116px;
        height: 116px;
        border-radius: 50%;
        box-shadow: var(--shadow-md);
        display: block;
      }

      .title {
        margin: 0;
        font-size: 108px;
        font-weight: 700;
        letter-spacing: 0.06em;
        line-height: 1.05;
        color: var(--brand);
      }

      .copy {
        margin: 0;
        max-width: 860px;
        color: var(--muted);
        font-size: 34px;
        font-weight: 400;
        line-height: 1.5;
      }

      .cta {
        margin-top: 6px;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 19px 56px;
        border-radius: 999px;
        background: var(--brand);
        color: #ffffff;
        font-size: 21px;
        font-weight: 700;
        letter-spacing: 0.22em;
        box-shadow: var(--shadow-brand);
      }

      .cta svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .foot {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 40px;
        margin: 0;
        text-align: center;
        color: var(--muted);
        font-size: 23px;
        font-weight: 400;
        letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <canvas id="net" width="1200" height="630"></canvas>

      <div class="content">
        <!-- public/assets/logo.svg, inlined so the render needs no file access -->
        <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="USAAIO Guide logo">
          <circle cx="32" cy="32" r="29" fill="#f5f0e8" stroke="#b84e30" stroke-width="3" />
          <g stroke="#d4805c" stroke-width="3" stroke-linecap="round">
            <path d="M25 47 L16 30" />
            <path d="M25 47 L32 30" />
            <path d="M25 47 L48 30" />
            <path d="M39 47 L16 30" />
            <path d="M39 47 L32 30" />
            <path d="M39 47 L48 30" />
            <path d="M16 30 L32 16" />
            <path d="M32 30 L32 16" />
            <path d="M48 30 L32 16" />
          </g>
          <g fill="#f5f0e8" stroke="#a8442a" stroke-width="2">
            <circle cx="25" cy="47" r="3.4" />
            <circle cx="39" cy="47" r="3.4" />
            <circle cx="16" cy="30" r="3.4" />
            <circle cx="32" cy="30" r="3.4" />
            <circle cx="48" cy="30" r="3.4" />
            <circle cx="32" cy="16" r="3.4" />
          </g>
        </svg>

        <h1 class="title">USAAIO GUIDE</h1>
        <p class="copy">
          Lessons, worked derivations, and auto-graded practice for the
          USA&nbsp;AI&nbsp;Olympiad, from Round&nbsp;1 through Camp.
        </p>
        <span class="cta">
          EXPLORE
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </span>
      </div>

      <p class="foot">www.aioinitiative.com &nbsp;·&nbsp; unofficial student guide</p>
    </div>

    <script>
      // Mirrors the hero particle field in src/app.js, but with a fixed seed so
      // re-rendering the card produces the same image.
      (function () {
        function mulberry32(a) {
          return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        const canvas = document.getElementById("net");
        const ctx = canvas.getContext("2d");
        const width = 1200;
        const height = 630;
        const rand = mulberry32(20260910);

        // Same density rule as the site: (w * h) / 16000, clamped to 28..90.
        const count = Math.max(28, Math.min(90, Math.floor((width * height) / 16000)));
        const particles = Array.from({ length: count }, () => ({
          x: rand() * width,
          y: rand() * height,
          r: 1.2 + rand() * 1.8,
        }));

        const linkDistance = Math.min(150, width / 7);
        for (let i = 0; i < particles.length; i += 1) {
          for (let j = i + 1; j < particles.length; j += 1) {
            const a = particles[i];
            const b = particles[j];
            const distance = Math.hypot(a.x - b.x, a.y - b.y);
            if (distance < linkDistance) {
              ctx.strokeStyle = `rgba(184, 78, 48, ${(1 - distance / linkDistance) * 0.3})`;
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }
        }

        ctx.fillStyle = "rgba(184, 78, 48, 0.5)";
        particles.forEach((p) => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        });

        // Signals to the screenshot driver that fonts are in and painting is done.
        document.fonts.ready.then(() => {
          document.documentElement.setAttribute("data-ready", "1");
        });
      })();
    </script>
  </body>
</html>
