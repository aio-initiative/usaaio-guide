<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Byte the robot mascot">
  <defs>
    <linearGradient id="bot-head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- antenna -->
  <line x1="120" y1="54" x2="120" y2="32" stroke="#4338ca" stroke-width="5" stroke-linecap="round"/>
  <circle cx="120" cy="26" r="7" fill="#f59e0b"/>
  <!-- ears -->
  <rect x="62" y="80" width="12" height="22" rx="6" fill="#4338ca"/>
  <rect x="166" y="80" width="12" height="22" rx="6" fill="#4338ca"/>
  <!-- head -->
  <rect x="72" y="52" width="96" height="76" rx="20" fill="url(#bot-head)"/>
  <!-- face screen -->
  <rect x="84" y="66" width="72" height="48" rx="12" fill="#1e1b4b"/>
  <circle cx="105" cy="86" r="7" fill="#ffffff"/>
  <circle cx="135" cy="86" r="7" fill="#ffffff"/>
  <path d="M106 100 Q120 110 134 100" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- raised arm holding star -->
  <path d="M154 142 L176 122" stroke="#4338ca" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M182 93 L185.1 102.7 L195.3 102.7 L187.1 108.7 L190.2 118.3 L182 112.3 L173.8 118.3 L176.9 108.7 L168.7 102.7 L178.9 102.7 Z" fill="#f59e0b"/>
  <!-- lowered arm -->
  <path d="M86 142 L68 166" stroke="#4338ca" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- neck + body -->
  <rect x="110" y="124" width="20" height="12" fill="#4338ca"/>
  <rect x="88" y="132" width="64" height="54" rx="16" fill="#6366f1"/>
  <!-- chest mark: mini neural network -->
  <circle cx="120" cy="159" r="15" fill="#ffffff"/>
  <g stroke="#8b5cf6" stroke-width="1.1" stroke-linecap="round">
    <path d="M114 166 L120 152"/>
    <path d="M126 166 L120 152"/>
  </g>
  <circle cx="114" cy="166" r="2.4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <circle cx="126" cy="166" r="2.4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <circle cx="120" cy="152" r="2.6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <!-- legs + feet -->
  <rect x="98" y="184" width="14" height="22" rx="7" fill="#4338ca"/>
  <rect x="128" y="184" width="14" height="22" rx="7" fill="#4338ca"/>
  <ellipse cx="105" cy="210" rx="13" ry="6" fill="#312e81"/>
  <ellipse cx="135" cy="210" rx="13" ry="6" fill="#312e81"/>
</svg>
