<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Sam the eagle mascot">
  <defs>
    <linearGradient id="eagle-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <!-- wings -->
  <ellipse cx="56" cy="156" rx="19" ry="38" fill="#3730a3" transform="rotate(18 56 156)"/>
  <ellipse cx="184" cy="156" rx="19" ry="38" fill="#3730a3" transform="rotate(-18 184 156)"/>
  <!-- body -->
  <ellipse cx="120" cy="152" rx="60" ry="62" fill="url(#eagle-body)"/>
  <!-- head -->
  <circle cx="120" cy="92" r="44" fill="#ffffff" stroke="#dbe3f0" stroke-width="3"/>
  <!-- feathered collar -->
  <path d="M84 108 L93 142 L101 120 L110 148 L120 124 L130 148 L139 120 L147 142 L156 108 Q138 124 120 124 Q102 124 84 108 Z" fill="#ffffff"/>
  <!-- brows -->
  <path d="M86 74 L110 80" stroke="#4f46e5" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M154 74 L130 80" stroke="#4f46e5" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- eyes -->
  <circle cx="103" cy="90" r="7.5" fill="#0f172a"/>
  <circle cx="137" cy="90" r="7.5" fill="#0f172a"/>
  <circle cx="105.5" cy="87.5" r="2.5" fill="#ffffff"/>
  <circle cx="139.5" cy="87.5" r="2.5" fill="#ffffff"/>
  <!-- beak -->
  <path d="M106 98 Q120 92 134 98 Q131 116 120 121 Q109 116 106 98 Z" fill="#f59e0b"/>
  <path d="M114 112 Q120 117 126 112" stroke="#b45309" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- chest star badge -->
  <circle cx="120" cy="169" r="21" fill="#eef2ff"/>
  <path d="M120 156 L122.9 165 L132.4 165 L124.7 170.5 L127.6 179.5 L120 174 L112.4 179.5 L115.3 170.5 L107.6 165 L117.1 165 Z" fill="#f59e0b"/>
  <!-- feet -->
  <ellipse cx="102" cy="212" rx="12" ry="7" fill="#f59e0b"/>
  <ellipse cx="138" cy="212" rx="12" ry="7" fill="#f59e0b"/>
</svg>
